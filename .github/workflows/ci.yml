name: CI

on:
  push:
  pull_request:

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:desktop
      - run: pnpm test:desktop:smoke
      - run: pnpm build:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: pomelo-chat-windows-x64
          path: release/*Setup.exe
          if-no-files-found: error
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pomelo_chat_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL_TEST: mysql://root:root@127.0.0.1:3306/pomelo_chat_test
      REDIS_URL_TEST: redis://127.0.0.1:6379/15
      JWT_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm --version
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:full:server
      - run: pnpm --filter pomelo-chat-server test:prisma
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:full:browser
        if: ${{ !cancelled() }}
      - run: node server/scripts/run-isolated-tests.js qa
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: validation-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
